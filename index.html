<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Få overblik over hvor mange tillægsgivende timer, du har arbejdet.">
    <meta property="og:image" content="https://anspl.dk/wp-content/uploads/2025/11/IMG_5223_2-scaled.jpeg">
    <title>Tillægsberegner – Danske Anæstesisygeplejersker</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styleguide.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YQEBJBNJV2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-YQEBJBNJV2');
    </script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.1/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        $(function () {
            $('[data-toggle="tooltip"]').tooltip();
        });
    </script>
</head>

<body>
    <header class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <a href="index.html">
                    <img src="./assets/300timer-alt.svg" alt="Danske Anæstesisygeplejerskers logo" />
                </a>
            </div>


            <nav class="navbar-links" id="nav-links">
                <a href="index.html" style="text-decoration: underline;">Forside</a>
                <a href="howto.html">Sådan gør du</a>
                <a href="about.html">Hvem vi er</a>
                <a href="https://selvbetjening.winkas.net/tilmelding.asp?wkid=215280015&navid=3">
                    <button class="secondary-btn">Bliv medlem</button>
                </a>
            </nav>

            <div class="navbar-burger" id="burger">
                <span class="material-symbols-outlined" id="burger-icon">menu</span>
            </div>
        </div>
    </header>
    <div class="container">

        <main class="content">

            <aside>
                <!-- Form -->
                <form class="form-section" id="shift-form">
                    <div class="title-w-btns">
                        <h1>Indtast timer</h1>
                        <a href="howto.html"><button class="rm-from-print rm-btn secondary-btn" type="button">Læs vores
                                guide</button></a>
                    </div>

                    <label>
                        Dato du møder ind<span style="color: red;">*</span>
                        <input type="date" id="date" required>
                    </label>

                    <div class="form-group">
                        <label>
                            Starttidspunkt<span style="color: red;">*</span>
                            <input type="time" id="start" required>
                        </label>

                        <label>
                            Sluttidspunkt<span style="color:red">*</span>

                            <span class="info-tooltip">
                                ⓘ
                                <span class="tooltip-text">
                                    Vagter kan højst være 24 timer lange.
                                </span>
                            </span>

                            <input type="time" id="end" required>
                        </label>
                    </div>

                    <label>
                        <h3>Tid på vagtværelse/i rådighed <span class="info-tooltip">
                                ⓘ
                                <span class="tooltip-text">
                                    Disse vil blive tolket som ikke-aktive rådighedstimer.
                                </span>
                            </span></h3>

                        <div class="form-group">
                            <label>
                                Første aftrædelse
                                <span class="info-tooltip">
                                    ⓘ
                                    <span class="tooltip-text">
                                        Vi behøver ikke vide, hvornår du har en fast aftale om fratrædelse.
                                        Du skal blot angive det tidligste tidspunkt, hvor du reelt er trådt fra. Det kan
                                        både være når I har aftalt det eller senere, hvis der var travlt.
                                    </span>
                                </span>
                                <input type="time" name="startOfBreak[]">
                            </label>
                            <label>
                                Blev kaldt kl.
                                <span class="info-tooltip">
                                    ⓘ
                                    <span class="tooltip-text">
                                        Dette felt skal være tomt, hvis du ikke blev kaldt efter aftrædelse.
                                    </span>
                                </span>
                                <input type="time" name="endOfBreak[]">
                            </label>
                        </div>

                        <div id="additional-breaks"></div>

                        <button id="add-break-btn" class="rm-from-print rm-btn secondary-btn" type="button">
                            Tilføj linje</button>

                    </label>

                    <div class="btn-group">
                        <button type="reset" class="secondary-btn">Ryd formular</button>
                        <button type="submit" class="primary-btn">Gem vagt</button>
                    </div>
                </form>
            </aside>

            <!-- Shift table -->
            <section>
                <div class="printable-table">
                    <div class="title-w-btns">
                        <!-- Title -->
                        <h1>Mine vagter</h1>
                        <!-- Buttons -->
                        <div class="btn-group rm-from-print">
                            <button class="secondary-btn" onclick="clearStorage()">Ryd al data</button>
                            <button class="primary-btn" onclick="window.print()">🖨️ Udskriv mine vagter</button>
                        </div>
                    </div>

                    <label>
                        <input type="checkbox" name="include-hours" value="yes">
                        Rådighedstimer / timer på værelse er tillægsgivende
                    </label>
                    <h2>Dine tillægsgivende timer i perioden: <span style="font-weight: 800;" id="total-hours">0</span>
                        / 300</h2>
                    <div class="table-wrapper">
                        <table class="shift-table">
                            <thead>
                                <tr>
                                    <th>Nr</th>
                                    <th>Dato</th>
                                    <th>Start</th>
                                    <th>Slut</th>
                                    <th>Vagtens længe</th>
                                    <th>Aktive timer i løbet af vagt</th>
                                    <th>Heraf tillægs<wbr>givende timer</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tfoot>
                                <tr>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td><strong>0</strong></td>
                                    <td><strong>0</strong></td>
                                    <td><strong>0</strong></td>
                                    <td></td>
                                </tr>
                            </tfoot>
                            <tbody id="shift-list"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>

    </div>
    <footer>
        <p>Har du feedback eller forslag? Skriv til <a
                href="mailto:lkp@anspl.dk?subject=Feedback tillægsberegner">lkp@anspl.dk</a>.</a>
        </p>
    </footer>
    <script src="script.js"></script>
    <script src="helligdage.js"></script>
</body>

</html>
