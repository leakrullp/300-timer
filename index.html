<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Få overblik over hvor mange tillægsgivende timer, du har arbejdet.">
    <meta property="og:image" content="https://anspl.dk/wp-content/uploads/2025/11/og-image-300.png">
    <title>Tillægsberegner – Danske Anæstesisygeplejersker</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="styleguide.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-YQEBJBNJV2"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-YQEBJBNJV2');
    </script>
</head>

<body>
    <header class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo">
                <a href="index.html">
                    <img src="./assets/300timer-alt.svg" alt="Danske Anæstesisygeplejerskers logo" />
                </a>
            </div>


            <nav class="navbar-links" id="nav-links">
                <a href="index.html" style="text-decoration: underline;">Forside</a>
                <a href="howto.html">Sådan gør du</a>
                <a href="about.html">Hvem vi er</a>
                <a href="https://selvbetjening.winkas.net/tilmelding.asp?wkid=215280015&navid=3">
                    <button class="secondary-btn">Bliv medlem</button>
                </a>
            </nav>

            <div class="navbar-burger" id="burger">
                <span class="material-symbols-outlined" id="burger-icon">menu</span>
            </div>
        </div>
    </header>
    <div class="container">

        <main class="content">

            <aside>
                <!-- Form -->
                <form class="form-section" id="shift-form">
                    <div class="title-w-btns">
                        <h1>Indtast timer</h1>
                        <a href="howto.html"><button class="rm-from-print rm-btn secondary-btn" type="button">Læs vores
                                guide</button></a>
                    </div>

                    <label>
                        Dato<span style="color: red;">*</span>
                        <input type="date" id="date" required>
                    </label>

                    <div class="form-group">
                        <label>
                            Starttidspunkt<span style="color: red;">*</span>
                            <input type="time" id="start" required>
                        </label>

                        <label>
                            Sluttidspunkt<span style="color: red;">*</span>
                            <input type="time" id="end" required>
                        </label>
                    </div>
                    <p>Der tages automatisk højde for sluttidspunkter der ligger i det efterfølgende døgn.</p>

                    <label>
                        Tid på vagtværelse i <a href="howto.html#timespan">tillægstidrummet:</a>
                        <div class="form-group">
                            <input type="number" id="myHours" placeholder="Timer" min="0" max="23">
                            <input type="number" id="myMinutes" placeholder="Minutter" min="0" max="59">
                        </div>
                    </label>

                    <div class="btn-group">
                        <button type="reset" class="secondary-btn">
                            Ryd formular</button>
                        <button type="submit" class="primary-btn">
                            Gem vagt</button>
                    </div>
                </form>
            </aside>

            <!-- Shift table -->
            <section>
                <div class="printable-table">
                    <div class="title-w-btns">
                        <!-- Title -->
                        <h1>Mine vagter</h1>
                        <!-- Buttons -->
                        <div class="btn-group rm-from-print">
                            <button class="secondary-btn" onclick="clearStorage()">Ryd al data</button>
                            <button class="primary-btn" onclick="printPage()">🖨️ Udskriv mine vagter</button>
                        </div>
                    </div>

                    <label>
                        <input type="checkbox" name="include-hours" value="yes">
                        Tid på vagtværelse er tillægsgivende
                    </label>
                    <h2>Tillægsgivende timer i perioden: <span style="font-weight: 800;" id="total-hours">0</span>
                        / 300</h2>
                    <div class="table-wrapper">
                        <table class="shift-table">
                            <thead>
                                <tr>
                                    <th>Nr</th>
                                    <th>Dato</th>
                                    <th>Start</th>
                                    <th>Slut</th>
                                    <th>Timer på vagt</th>
                                    <th>Værelses<wbr>timer</th>
                                    <th>Tillægs<wbr>givende timer</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tfoot>
                                <tr>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td></td>
                                    <td><strong>0</strong></td>
                                    <td><strong>0</strong></td>
                                    <td><strong>0</strong></td>
                                    <td></td>
                                </tr>
                            </tfoot>
                            <tbody id="shift-list"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>

    </div>
    <script src="script.js"></script>
    <script src="helligdage.js"></script>
</body>

</html>
