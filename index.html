<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tillægsberegner – 300 timer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="styleguide.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>
    <div class="container">
        <header class="navbar">
            <div class="navbar-container">
                <div class="navbar-logo">
                    <img src="./assets/ANSPL-logo.svg" alt="Danske Anæstesisygeplejerskers logo" />
                </div>


                <nav class="navbar-links" id="nav-links">
                    <a href="#howto">Sådan gør du</a>
                    <a href="#aboutus">Hvem vi er</a>
                    <a href="https://selvbetjening.winkas.net/tilmelding.asp?wkid=215280015&navid=3">
                        <button class="secondary-btn">Meld dig ind</button>
                    </a>
                </nav>

                <div class="navbar-burger" id="burger">
                    <span class="material-symbols-outlined" id="burger-icon">menu</span>
                </div>
            </div>
        </header>

        <main class="content">

            <aside>
                <!-- Form -->
                <form class="form-section" id="shift-form">
                    <div class="title-w-btns">
                        <h1>Indtast timer</h1>
                    </div>

                    <label>
                        Dato <span style="color: red;">*</span>
                        <input type="date" id="date" required>
                    </label>

                    <div class="form-group">
                        <label>
                            Starttidspunkt <span style="color: red;">*</span>
                            <input type="time" id="start" required>
                        </label>

                        <label>
                            Sluttidspunkt <span style="color: red;">*</span>
                            <input type="time" id="end" required>
                        </label>
                    </div>

                    <label>
                        Heraf timer på vagtværelse: <br><span style="color: grey; font-weight: normal;">
                            Hvis timer på værelse tæller
                            i din lokaleaftale, kan du undlade at udfylde. Hvis du er i gang med at indtaste en
                            fremtidig
                            vagt,
                            anbefaler vi at angive din typiske "worst case" f.eks. 5 timer på vagtværelse.</span><br>
                        <input type="number" name="roomtime" id="roomtime" min="0" step="0.25" />
                    </label>

                    <div class="btn-group">
                        <button type="submit" class="primary-btn">
                            Tilføj vagt</button>
                    </div>
                </form>
            </aside>

            <!-- Shift table -->
            <section>
                <div class="printable-table">
                    <div class="title-w-btns">
                        <!-- Title -->
                        <h1>Mine vagter</h1>
                        <!-- Buttons -->
                        <div class="btn-group rm-from-print">
                            <button class="secondary-btn" onclick="clearStorage()">Ryd al data</button>
                            <button class="primary-btn" onclick="printPage()">🖨️ Print mine vagter ud</button>
                        </div>
                    </div>

                    <label>
                        <input type="checkbox" name="include-hours" value="yes">
                        Timer på vagtværelse tæller med (dette vil fremgå af din lokalaftale)
                    </label>
                    <h2>Samlet antal timer i år: <strong id="total-hours">0</strong> / 300</h2>
                    <div class="table-wrapper">
                        <table class="shift-table">
                            <thead>
                                <tr>
                                    <th>Nr</th>
                                    <th>Dato</th>
                                    <th>Start</th>
                                    <th>Slut</th>
                                    <th>Timer på værelse</th>
                                    <th>Tillægsgivende timer i alt</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="shift-list"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>

    </div>
    <script src="script.js"></script>
</body>

</html>
